        /* Custom map marker pulse animation */
        .user-location-marker {
            background-color: #3b82f6;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }

        }

            background: #cbd5e1;

        }

        let map = null;
        let markersGroup = null;
        let userMarker = null;
        let activeMobileView = 'map'; // 'map' or 'list'

        // Category Icon Mapping & Colors
        const categoryConfig = {
            cafes: { label: '餐廳/咖啡廳', color: '#d97706', bg: 'bg-amber-100', text: 'text-amber-800', icon: 'coffee' },
            hotels: { label: '旅宿/民宿', color: '#2563eb', bg: 'bg-blue-100', text: 'text-blue-800', icon: 'hotel' },
            parks: { label: '景點/公園', color: '#16a34a', bg: 'bg-emerald-100', text: 'text-emerald-800', icon: 'trees' },
            supplies: { label: '用品/醫院', color: '#9333ea', bg: 'bg-purple-100', text: 'text-purple-800', icon: 'shopping-bag' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadStoresData();
            loadBookmarks();
            initMap();
            renderStoreList();
            setupEventListeners();
            lucide.createIcons();
        });

        // Load stores from LocalStorage or use Default
        function loadStoresData() {
            const saved = localStorage.getItem('pet_friendly_stores');
            if (saved) {
                try {
                    stores = JSON.parse(saved);
                } catch(e) {
                    stores = [...initialStores];
                }
            } else {
                stores = [...initialStores];
                localStorage.setItem('pet_friendly_stores', JSON.stringify(stores));
            }
        }

        // Load bookmarks from LocalStorage
        function loadBookmarks() {
            const saved = localStorage.getItem('pet_friendly_bookmarks');
            if (saved) {
                try {
                    bookmarks = new Set(JSON.parse(saved));
                } catch(e) {
                    bookmarks = new Set();
                }
            }
            updateFavoriteBadge();
        }

        // Initialize Leaflet Map
        function initMap() {
            // Default centered at Taiwan middle/Taipei
            map = L.map('map', {
                zoomControl: false
            }).setView([24.5, 120.9], 8);

            // Zoom controls repositioned
            L.control.zoom({ position: 'topright' }).addTo(map);

            // OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        // Render or Update Map Markers based on filtered stores
        function updateMapMarkers() {
            if (!map || !markersGroup) return;
            markersGroup.clearLayers();

            const filtered = getFilteredStores();

            filtered.forEach(store => {
                const config = categoryConfig[store.category] || categoryConfig.cafes;
                
                // Custom Leaflet DivIcon
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `
                        <div style="background-color: ${config.color};" class="w-8 h-8 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-xs transform hover:scale-110 transition duration-150">
                            🐾
                        </div>
                    `,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -32]
                });

                const marker = L.marker([store.lat, store.lng], { icon: customIcon });

                // Popup content
                const popupHTML = `
                    <div class="p-1 max-w-xs font-sans">
                        <img src="${store.image}" class="w-full h-24 object-cover rounded-lg mb-2" alt="${store.name}" onerror="this.src='https://placehold.co/400x250/e2e8f0/64748b?text=寵物友善店家'">
                        <span class="text-[10px] px-2 py-0.5 rounded ${config.bg} ${config.text} font-bold">${config.label}</span>
                        <h4 class="font-bold text-sm text-slate-800 mt-1">${store.name}</h4>
                        <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">📍 ${store.address}</p>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="text-xs font-bold text-amber-600">⭐ ${store.rating} (${store.reviewsCount})</span>
                            <button onclick="openDetailModal('${store.id}')" class="text-xs bg-amber-600 text-white px-2.5 py-1 rounded-md font-medium hover:bg-amber-700 transition">
                                查看詳情
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHTML);
                markersGroup.addLayer(marker);
            });

            // Adjust bounds if results exist
            if (filtered.length > 0) {
                const bounds = L.latLngBounds(filtered.map(s => [s.lat, s.lng]));
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
            }
        }

        // Get filtered stores array
        function getFilteredStores() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const cityVal = document.getElementById('cityFilter').value;
            const categoryVal = document.getElementById('categoryFilter').value;
            const onlyFavorites = document.getElementById('showFavoritesBtn').classList.contains('ring-2');

            return stores.filter(store => {
                // Search match
                const matchSearch = !searchVal || 
                    store.name.toLowerCase().includes(searchVal) ||
                    store.address.toLowerCase().includes(searchVal) ||
                    store.description.toLowerCase().includes(searchVal);

                // City match
                const matchCity = cityVal === 'ALL' || store.city === cityVal;

                // Category match
                const matchCategory = categoryVal === 'ALL' || store.category === categoryVal;

                // Pet rules match
                const matchRules = activeRules.size === 0 || Array.from(activeRules).every(rule => store.rules.includes(rule));

                // Favorite match
                const matchFav = !onlyFavorites || bookmarks.has(store.id);

                return matchSearch && matchCity && matchCategory && matchRules && matchFav;
            });
        }

        // Render Store List Cards
        function renderStoreList() {
            const container = document.getElementById('storeList');
            const filtered = getFilteredStores();
            document.getElementById('resultCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i data-lucide="paw-print" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="font-semibold text-slate-600">找不到符合條件的寵物店家</p>
                        <p class="text-xs mt-1">請嘗試調整搜尋條件或類別篩選</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(store => {
                const isBookmarked = bookmarks.has(store.id);
                const config = categoryConfig[store.category] || categoryConfig.cafes;

                return `
                    <div class="store-card bg-white rounded-xl p-3 shadow-sm hover:shadow-md border border-slate-100 transition cursor-pointer flex flex-col sm:flex-row gap-3 relative group"
                         onclick="focusStore('${store.id}')">
                        
                        <!-- Store Image -->
                        <div class="w-full sm:w-28 h-28 flex-none rounded-lg overflow-hidden bg-slate-100 relative">
                            <img src="${store.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${store.name}" onerror="this.src='https://placehold.co/300x300/e2e8f0/64748b?text=寵物友善'">
                            <span class="absolute top-1.5 left-1.5 text-[10px] px-2 py-0.5 rounded ${config.bg} ${config.text} font-bold shadow-sm">
                                ${config.label}
                            </span>
                        </div>

                        <!-- Info -->
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-slate-800 text-base group-hover:text-amber-600 transition">${store.name}</h3>
                                    <!-- Favorite button -->
                                    <button onclick="event.stopPropagation(); toggleBookmark('${store.id}')" class="text-slate-300 hover:text-red-500 transition p-1" title="加入收藏">
                                        <i data-lucide="heart" class="w-5 h-5 ${isBookmarked ? 'text-red-500 fill-red-500' : ''}"></i>
                                    </button>
                                </div>
                                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 flex-none text-slate-400"></i>
                                    <span class="truncate">${store.address}</span>
                                </p>
                            </div>

                            <!-- Pet Rule Badges -->
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${store.rules.map(r => `<span class="text-[10px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full border border-amber-200">🐾 ${r}</span>`).join('')}
                            </div>

                            <!-- Bottom Row -->
                            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50">
                                <div class="flex items-center space-x-1">
                                    <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400"></i>
                                    <span class="text-xs font-bold text-slate-700">${store.rating}</span>
                                    <span class="text-[10px] text-slate-400">(${store.reviewsCount})</span>
                                </div>
                                <button onclick="event.stopPropagation(); openDetailModal('${store.id}')" class="text-xs font-semibold text-amber-600 hover:text-amber-800 flex items-center gap-0.5">
                                    詳細資料 <i data-lucide="chevron-right" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Focus map to specific store when card is clicked
        function focusStore(id) {
            const store = stores.find(s => s.id === id);
            if (!store || !map) return;

            map.setView([store.lat, store.lng], 15, { animate: true });

            // Find marker and open popup
            markersGroup.eachLayer(layer => {
                if (layer.getLatLng().lat === store.lat && layer.getLatLng().lng === store.lng) {
                    layer.openPopup();
                }
            });

            // On mobile, automatically switch back to map view after selection
            if (window.innerWidth < 768 && activeMobileView === 'list') {
                toggleMobileView();
            }
        }

        // Open Detail Modal Window
        function openDetailModal(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            const isBookmarked = bookmarks.has(store.id);
            const config = categoryConfig[store.category] || categoryConfig.cafes;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="relative h-48 sm:h-56">
                    <img src="${store.image}" class="w-full h-full object-cover" alt="${store.name}" onerror="this.src='https://placehold.co/600x400/e2e8f0/64748b?text=寵物友善店家'">
                    <span class="absolute top-3 left-3 text-xs px-2.5 py-1 rounded-full ${config.bg} ${config.text} font-bold shadow-md">
                        ${config.label}
                    </span>
                </div>

                <div class="p-6">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">${store.name}</h2>
                            <div class="flex items-center space-x-1 mt-1">
                                <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
                                <span class="text-sm font-bold text-slate-700">${store.rating}</span>
                                <span class="text-xs text-slate-400">(${store.reviewsCount} 則評價)</span>
                            </div>
                        </div>
                        <button onclick="toggleBookmark('${store.id}')" class="p-2.5 rounded-full border border-slate-200 hover:bg-slate-50 transition">
                            <i data-lucide="heart" class="w-5 h-5 ${isBookmarked ? 'text-red-500 fill-red-500' : 'text-slate-400'}"></i>
                        </button>
                    </div>

                    <p class="text-sm text-slate-600 mb-4 leading-relaxed">${store.description}</p>

                    <div class="space-y-2.5 border-t border-b border-slate-100 py-4 mb-4 text-xs sm:text-sm">
                        <div class="flex items-start gap-2 text-slate-600">
                            <i data-lucide="map-pin" class="w-4 h-4 text-amber-600 flex-none mt-0.5"></i>
                            <span>${store.address}</span>
                        </div>
                        <div class="flex items-center gap-2 text-slate-600">
                            <i data-lucide="phone" class="w-4 h-4 text-amber-600 flex-none"></i>
                            <a href="tel:${store.phone}" class="hover:underline text-amber-700">${store.phone || '未提供電話'}</a>
                        </div>
                        <div class="flex items-center gap-2 text-slate-600">
                            <i data-lucide="clock" class="w-4 h-4 text-amber-600 flex-none"></i>
                            <span>${store.hours || '營業時間請洽店家'}</span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">寵物友善規範與設施</h4>
                        <div class="flex flex-wrap gap-1.5">
                            ${store.rules.map(r => `<span class="text-xs bg-amber-100 text-amber-800 font-medium px-3 py-1 rounded-lg">🐾 ${r}</span>`).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.name + ' ' + store.address)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center space-x-1.5 bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl font-semibold text-sm transition shadow-sm">
                            <i data-lucide="navigation" class="w-4 h-4"></i>
                            <span>開啟導航</span>
                        </a>
                        <button onclick="focusStore('${store.id}'); closeDetailModal();" class="flex items-center justify-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold text-sm transition">
                            <i data-lucide="map" class="w-4 h-4"></i>
                            <span>地圖定位</span>
                        </button>
                    </div>
                </div>
            `;

            lucide.createIcons();
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Bookmark Toggle Functionality
        function toggleBookmark(id) {
            if (bookmarks.has(id)) {
                bookmarks.delete(id);
                showToast('已從收藏清單移除');
            } else {
                bookmarks.add(id);
                showToast('已加入我的收藏');
            }
            localStorage.setItem('pet_friendly_bookmarks', JSON.stringify(Array.from(bookmarks)));
            updateFavoriteBadge();
            renderStoreList();
            
            // Update detail modal heart if open
            const modal = document.getElementById('detailModal');
            if (!modal.classList.contains('hidden')) {
                openDetailModal(id);
            }
        }

        function updateFavoriteBadge() {
            document.getElementById('favoriteBadge').textContent = bookmarks.size;
        }

        // Geolocation: Find user current position
        function locateUser() {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援 GPS 地理定位');
                return;
            }

            showToast('正在尋找您的目前位置...');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    // User Location Pulse Marker
                    const userIcon = L.divIcon({
                        className: 'user-location-marker',
                        iconSize: [18, 18]
                    });

                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map)
                        .bindPopup('<div class="font-bold text-xs p-1">📍 您的目前位置</div>')
                        .openPopup();

                    map.setView([lat, lng], 14, { animate: true });
                    showToast('已成功定位您的位置');
                },
                (error) => {
                    showToast('無法取得您的位置，請確認定位權限已開啟');
                }
            );
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Search Input
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                renderStoreList();
                updateMapMarkers();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderStoreList();
                updateMapMarkers();
            });

            // Filters Dropdown
            document.getElementById('cityFilter').addEventListener('change', () => {
                renderStoreList();
                updateMapMarkers();
            });

            document.getElementById('categoryFilter').addEventListener('change', () => {
                renderStoreList();
                updateMapMarkers();
            });

            // Rule Chips Filter Buttons
            document.querySelectorAll('.rule-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const rule = btn.getAttribute('data-rule');
                    if (activeRules.has(rule)) {
                        activeRules.delete(rule);
                        btn.classList.remove('bg-amber-600', 'text-white', 'border-amber-600');
                        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                    } else {
                        activeRules.add(rule);
                        btn.classList.add('bg-amber-600', 'text-white', 'border-amber-600');
                        btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                    }
                    renderStoreList();
                    updateMapMarkers();
                });
            });

            // Reset Filters
            document.getElementById('resetFiltersBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearchBtn').classList.add('hidden');
                document.getElementById('cityFilter').value = 'ALL';
                document.getElementById('categoryFilter').value = 'ALL';
                
                activeRules.clear();
                document.querySelectorAll('.rule-chip').forEach(btn => {
                    btn.classList.remove('bg-amber-600', 'text-white', 'border-amber-600');
                    btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                });

                const favBtn = document.getElementById('showFavoritesBtn');
                favBtn.classList.remove('ring-2', 'ring-white', 'bg-amber-800');

                renderStoreList();
                updateMapMarkers();
                showToast('已重設所有篩選條件');
            });

            // Toggle Favorites Only Filter
            document.getElementById('showFavoritesBtn').addEventListener('click', function() {
                this.classList.toggle('ring-2');
                this.classList.toggle('ring-white');
                this.classList.toggle('bg-amber-800');
                renderStoreList();
                updateMapMarkers();
            });

            // GPS Locate
            document.getElementById('locateMeBtn').addEventListener('click', locateUser);

            // Detail Modal Close
            document.getElementById('closeDetailModal').addEventListener('click', closeDetailModal);

            // Add Store Modal Controls
            const addModal = document.getElementById('addModal');
            document.getElementById('openAddModalBtn').addEventListener('click', () => {
                addModal.classList.remove('hidden');
            });
            document.getElementById('closeAddModal').addEventListener('click', () => {
                addModal.classList.add('hidden');
            });

            // Add Store Form Submission
            document.getElementById('addStoreForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const name = document.getElementById('addName').value.trim();
                const category = document.getElementById('addCategory').value;
                const city = document.getElementById('addCity').value;
                const address = document.getElementById('addAddress').value.trim();
                let lat = parseFloat(document.getElementById('addLat').value);
                let lng = parseFloat(document.getElementById('addLng').value);
                const phone = document.getElementById('addPhone').value.trim();
                const description = document.getElementById('addDesc').value.trim();

                // Selected rules checkboxes
                const selectedRules = [];
                document.querySelectorAll('input[name="addRules"]:checked').forEach(cb => {
                    selectedRules.push(cb.value);
                });

                // Default fallback coords (Center of Taiwan approx) if empty
                if (isNaN(lat)) lat = 24.1500;
                if (isNaN(lng)) lng = 120.6700;

                const newStore = {
                    id: 'custom_' + Date.now(),
                    name,
                    category,
                    city,
                    address,
                    lat,
                    lng,
                    phone: phone || '無提供',
                    rating: 5.0,
                    reviewsCount: 1,
                    rules: selectedRules.length > 0 ? selectedRules : ['允許落地'],
                    hours: '請洽店家',
                    image: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=600&q=80',
                    description: description || '使用者推薦寵物友善空間'
                };

                stores.unshift(newStore);
                localStorage.setItem('pet_friendly_stores', JSON.stringify(stores));

                addModal.classList.add('hidden');
                document.getElementById('addStoreForm').reset();

                renderStoreList();
                updateMapMarkers();
                focusStore(newStore.id);
                showToast('成功推薦新店家！已儲存於瀏覽器');
            });

            // Mobile Toggle List/Map View
            document.getElementById('mobileToggleBtn').addEventListener('click', toggleMobileView);
        }

        // Mobile Layout Toggle (List vs Map)
        function toggleMobileView() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            const toggleIcon = document.getElementById('toggleIcon');

            if (activeMobileView === 'map') {
                activeMobileView = 'list';
                sidebar.classList.remove('hidden');
                sidebar.classList.add('fixed', 'inset-x-0', 'bottom-0', 'top-16', 'z-30');
                toggleText.textContent = '切換為地圖檢視';
                toggleIcon.setAttribute('data-lucide', 'map');
            } else {
                activeMobileView = 'map';
                sidebar.classList.add('hidden');
                sidebar.classList.remove('fixed', 'inset-x-0', 'bottom-0', 'top-16', 'z-30');
                toggleText.textContent = '切換為列表檢視';
                toggleIcon.setAttribute('data-lucide', 'list');
                if (map) map.invalidateSize();
            }
            lucide.createIcons();
        }

        // Toast Alert Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');

            toastMsg.textContent = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');

            setTimeout(() => {
                toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
